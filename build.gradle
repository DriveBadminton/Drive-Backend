plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gumraze.rallyon'
version = '0.0.1-SNAPSHOT'
description = 'Badminton App Project RallyOn'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'org.springframework.security:spring-security-oauth2-authorization-server'
	implementation 'commons-logging:commons-logging:1.3.5'
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	// flyway
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// 최신 springdoc
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1"

	// postgreSQL 의존성 추가
	implementation 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'

	// Spring AI
	implementation platform("org.springframework.ai:spring-ai-bom:2.0.0-M3")
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	testImplementation platform("org.testcontainers:testcontainers-bom:1.20.6")

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testImplementation 'com.h2database:h2'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:testcontainers'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

tasks.named('test') {
	useJUnitPlatform()

	// Suppress JDK warnings related to dynamic agent loading and CDS in tests.
	jvmArgs '-XX:+EnableDynamicAgentLoading', '-Xshare:off'

	doFirst {
		// Pre-install Byte Buddy agent to avoid Mockito self-attaching warnings.
		def byteBuddyAgentJar = configurations.testRuntimeClasspath.files.find { it.name.startsWith('byte-buddy-agent') }
		if (byteBuddyAgentJar != null) {
			jvmArgs "-javaagent:${byteBuddyAgentJar.absolutePath}"
		}
	}
}
